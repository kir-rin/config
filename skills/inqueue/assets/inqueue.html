<style>

<div class="cols">
  <section class="queue" aria-label="대기열">
    <header>
      <h1>__INQUEUE_TITLE__</h1>
      <p class="sub" id="summary">티켓을 불러오는 중이에요.</p>
    </header>
    <form class="add" id="add">
      <input type="text" id="newTitle" placeholder="새 티켓 제목을 쓰고 Enter" aria-label="새 티켓 제목" maxlength="200">
    </form>
    <div id="groups" class="queue"></div>
  </section>
  <section class="editor" id="editor" aria-label="티켓"></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
const STATUSES = ['ai', 'me', 'done'];
const GROUPS = ['me', 'ai', 'done'];
const FIELDS = [
  ['decide', '내가 정할 것', 'Claude'],
  ['judgment', '내 판단', '나'],
  ['why', '왜·무엇을', '나'],
  ['done', '끝난 기준', '나'],
  ['research', '조사·구현 기록', 'Claude'],
];
// 칸이 글 길이만큼 늘어나 칸 안에서 스크롤하지 않게 한다
const grow = (a) => { a.style.height = 'auto'; a.style.height = `${a.scrollHeight}px`; };
const growAll = () => document.querySelectorAll('.editor textarea').forEach(grow);
addEventListener('resize', growAll);
if (document.fonts) document.fonts.ready.then(growAll);

const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids.filter((k) => k !== null)); return n; };
const busy = (t) => t.status === 'ai' && t.claimedAt > Date.now() - 3600000;

// Claude 칸의 마크다운(문단·목록·`코드`·**굵게**·코드 울타리). 글은 textContent 로만 넣는다
// 백틱 없이 적힌 경로·파일:줄도 코드로 보인다. 「ai/me」 같은 낱말은 경로로 치지 않는다
const isPath = (p) => /\.[a-zA-Z]\w{0,7}(:\d+(-\d+)?)?$/.test(p) || /:\d+(-\d+)?$/.test(p) || /^(~?\/|(src|docs|test|tests|scripts|config|examples|prisma|app|lib|packages)\/)/.test(p);
function plainMd(s, out) {
  const re = /(?<![\w./:~-])(?:~?\/)?(?:[\w.@-]+\/)*[\w.@-]*\w(?::\d+(?:-\d+)?)?/g;
  let i = 0, m;
  while ((m = re.exec(s))) {
    if (!(m[0].includes('/') || /\.[a-zA-Z]\w{0,7}:\d+/.test(m[0])) || !isPath(m[0])) continue;
    if (m.index > i) out.push(s.slice(i, m.index));
    out.push(el('code', { textContent: m[0] }));
    i = re.lastIndex;
  }
  if (i < s.length) out.push(s.slice(i));
}
// 물결표 하나(~78장)는 취소선이 아니다. ~~두 개~~ 만 취소선으로 본다
if (window.marked) marked.use({ tokenizer: { del(src) {
  const m = /^~~(?=\S)([\s\S]*?\S)~~/.exec(src);
  return m ? { type: 'del', raw: m[0], text: m[1], tokens: this.lexer.inlineTokens(m[1]) } : undefined;
} } });
function mdBlocks(text) {
  if (!window.marked || !window.DOMPurify) return [el('p', { textContent: text, style: 'white-space:pre-wrap' })];
  // 「A. 내용」 선택지는 글자를 굵게 해 눈에 띄게 한다
  const src = text.replace(/^([A-Z])\.\s+/gm, '**$1.** ');
  const root = el('div', { innerHTML: DOMPurify.sanitize(marked.parse(src, { gfm: true, breaks: true })) });
  root.querySelectorAll('a').forEach((a) => { a.target = '_blank'; a.rel = 'noopener'; });
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const texts = [];
  while (walk.nextNode()) if (!walk.currentNode.parentElement.closest('code,pre,a')) texts.push(walk.currentNode);
  for (const node of texts) {
    const out = [];
    plainMd(node.nodeValue, out);
    if (out.some((x) => typeof x !== 'string')) node.replaceWith(...out);
  }
  return [...root.childNodes];
}

let db = null, tickets = [], selected = null, dirty = false, loaded = false, logOpen = false, doneOpen = false;

function row(t) {
  const tags = [t.safe ? 'safe' : null].filter(Boolean).join(' ');
  const b = el('button', { type: 'button', className: 'row', onclick: () => select(t.id) },
    el('span', { className: `dot ${t.status}` }),
    el('span', { textContent: t.title || '(제목 없음)' }),
    el('span', { className: 'tags' }, busy(t) ? el('span', { className: 'busy', textContent: '작업 중 ' }) : null, tags));
  b.setAttribute('aria-current', String(t.id === selected));
  return el('li', {}, b);
}

function renderList() {
  const newest = (a, b) => (b.createdAt || 0) - (a.createdAt || 0);
  const box = $('groups');
  const known = (t) => STATUSES.includes(t.status);
  const groups = GROUPS.map((s) => [s, tickets.filter((t) => t.status === s).sort(newest)]);
  const rest = tickets.filter((t) => !known(t)).sort(newest);
  if (rest.length) groups.push(['기타', rest]);
  const shown = groups.filter(([, list]) => list.length);
  // done 은 쌓이기만 하니 한 줄로 접어 둔다. 지금 보는 티켓이 그 안에 있으면 펼친다
  if (shown.length) box.replaceChildren(...shown.map(([s, list]) => s === 'done' ? el('details', { className: 'past', open: doneOpen || list.some((t) => t.id === selected), ontoggle: (e) => { doneOpen = e.target.open; } },
    el('summary', {}, el('span', { className: 'round', textContent: 'done' }), el('span', { className: 'when', textContent: String(list.length) })),
    el('ul', {}, ...list.map(row))) : el('div', { className: 'group' }, el('h2', {}, s, el('span', { textContent: String(list.length) })), el('ul', {}, ...list.map(row)))));
  else box.replaceChildren(loaded ? el('p', { className: 'empty', textContent: '티켓이 없어요. 위에 제목을 적어 첫 티켓을 만드세요.' }) : '');
  if (loaded) $('summary').textContent = `내 차례 ${groups[0][1].length}장 · AI 차례 ${groups[1][1].length}장`;
}

// 지난 판단은 회차마다 AI 가 쓴 한 문장 요약으로 접어 둔다. 사람이 여닫은 것은 다시 그려도 유지한다
const pastOpen = {};
function pastJudgments(t) {
  const list = Array.isArray(t.history) ? t.history : [];
  if (!list.length) return null;
  const when = (at) => new Date(at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric' });
  const rows = list.map((h, i) => {
    const key = `${t.id}:${i}`;
    return el('details', { className: 'past', open: pastOpen[key] ?? false, ontoggle: (e) => { pastOpen[key] = e.target.open; } },
      el('summary', {},
        el('span', { className: 'round', textContent: `${i + 1}회차` }),
        el('span', { className: 'when', textContent: h.at ? when(h.at) : '' }),
        el('span', { className: 'gist', textContent: h.summary || (h.judgment || '').split('\n').join(' · ') })),
      el('div', { className: 'past-body' },
        h.decide ? el('div', { className: 'ai-text' }, ...mdBlocks(h.decide)) : null,
        el('div', { className: 'answer' }, el('small', { className: 'chip', textContent: '나' }), el('span', { textContent: h.judgment || '' }))));
  }).reverse();
  return el('section', { className: 'zone' }, el('h3', {}, '지난 판단 ', el('span', { className: 'when', textContent: String(list.length) })), el('div', {}, ...rows));
}

const VIEW = ['title', 'status', 'safe', 'why', 'done', 'research', 'decide', 'judgment', 'history', 'questions'];
// 질문 카드: 질문·추천·선택지·근거를 한자리에. 고른 답은 넘길 때까지 이 화면의 메모리에만 둔다
const picked = {};
// 저장 전 글과 고른 답은 이 브라우저에 임시로 둔다. 페이지를 다시 불러와도 되살린다
const DRAFT_KEYS = ['title', 'judgment', 'why', 'done'];
const draftOf = (id) => { try { return JSON.parse(localStorage.getItem(`draft:${id}`)) || {}; } catch (e) { return {}; } };
const putDraft = (id, d) => {
  try {
    if (Object.keys(d.fields || {}).length || Object.keys(d.picks || {}).length) localStorage.setItem(`draft:${id}`, JSON.stringify(d));
    else localStorage.removeItem(`draft:${id}`);
  } catch (e) { /* 임시 저장을 못 해도 페이지는 그대로 쓴다 */ }
};
const questionsOf = (t) => (Array.isArray(t.questions) ? t.questions.filter((q) => q && q.q) : []);
const pickOf = (t, q) => (picked[t.id] || {})[q.q];
const composeAnswer = (t, note) => questionsOf(t).map((q, i) => `${i + 1}. ${q.q}\n→ ${pickOf(t, q) || '(답 안 함)'}`).join('\n') + (note.trim() ? `\n\n${note.trim()}` : '');
const questionsText = (qs) => qs.map((q, i) => `${i + 1}. ${q.q}${(Array.isArray(q.evidence) ? q.evidence : []).map((e) => `\n   - ${e.source || ''}: ${e.quote || ''}`).join('')}`).join('\n');
function questionCards(t, qs, onPick) {
  return el('div', { className: 'qs' }, ...qs.map((q, i) => {
    const opts = Array.isArray(q.options) ? q.options : [];
    const rec = opts.find((o) => o.recommended);
    const btns = opts.map((o) => {
      const b = el('button', { type: 'button', className: 'opt', textContent: (o.recommended ? '★ ' : '') + o.label, onclick: () => {
        (picked[t.id] = picked[t.id] || {})[q.q] = o.label;
        other.value = '';
        btns.forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
        onPick();
      } });
      b.setAttribute('aria-pressed', String(pickOf(t, q) === o.label));
      return b;
    });
    // 선택지에 없는 답은 직접 적는다. 적으면 버튼 선택이 풀린다
    const cur = pickOf(t, q);
    const other = el('input', { type: 'text', className: 'opt-input', placeholder: '직접 적기', value: cur && !opts.some((o) => o.label === cur) ? cur : '',
      onkeydown: (e) => { if (e.key === 'Enter') e.preventDefault(); },
      oninput: (e) => {
        e.stopPropagation();
        const mine = (picked[t.id] = picked[t.id] || {});
        if (e.target.value.trim()) mine[q.q] = e.target.value.trim(); else delete mine[q.q];
        btns.forEach((x) => x.setAttribute('aria-pressed', 'false'));
        onPick();
      } });
    other.setAttribute('aria-label', '직접 적기');
    const ev = Array.isArray(q.evidence) ? q.evidence.filter((e) => e && (e.source || e.quote)) : [];
    const key = `${t.id}:q:${q.q}`;
    const proof = ev.length
      ? el('details', { className: 'past', open: pastOpen[key] ?? i === 0, ontoggle: (e) => { pastOpen[key] = e.target.open; } },
        el('summary', {}, el('span', { className: 'round', textContent: `근거 ${ev.length}` })),
        el('div', { className: 'evs' }, ...ev.map((e) => el('div', { className: 'ev' }, e.source ? el('code', { textContent: e.source }) : null, e.quote ? el('span', { textContent: e.quote }) : null))))
      : el('p', { className: 'noev', textContent: '근거 없음' });
    return el('div', { className: 'q' },
      el('div', { className: 'q-head' }, el('span', { className: 'q-n', textContent: String(i + 1) }), el('div', { className: 'ai-text plain' }, ...mdBlocks(q.q))),
      rec ? el('p', { className: 'rec' }, '추천: ', el('b', { textContent: rec.label }), q.why ? ` — ${q.why}` : '') : null,
      el('div', { className: 'opts' }, ...btns, other),
      proof);
  }));
}
const keyOf = (t) => (t ? JSON.stringify(VIEW.map((k) => t[k] ?? null)) : '');
let shownKey = '', selfWrite = false;
function showFresh() {
  if ($('fresh')) return;
  $('editor').prepend(el('button', { type: 'button', id: 'fresh', className: 'fresh', textContent: '이 티켓에 새 내용이 있어요. 눌러서 불러오기', onclick: () => {
    if (dirty) { const n = $('note'); if (n) n.textContent = '저장한 뒤 불러올 수 있어요.'; return; }
    renderEditor();
  } }));
}

// 조사 기록은 「### n회차」 묶음. 위가 최신이고 최신만 펼친다. 묶음이 하나면 그냥 글로 보인다
function researchBlocks(t, plain) {
  const parts = (t.research || '').split(/^(?=### )/m).filter((p) => p.trim());
  if (parts.length < 2) return plain;
  return el('div', {}, ...parts.map((p, i) => {
    const m = /^### (.*)\n?([\s\S]*)$/.exec(p);
    const title = m ? m[1] : '이전 기록', body = m ? m[2] : p;
    const key = `${t.id}:r:${title}`;
    return el('details', { className: 'past', open: pastOpen[key] ?? i === 0, ontoggle: (e) => { pastOpen[key] = e.target.open; } },
      el('summary', {}, el('span', { className: 'gist', textContent: title })),
      el('div', { className: 'past-body' }, el('div', { className: 'ai-text' }, ...mdBlocks(body))));
  }));
}

function renderEditor() {
  const t = tickets.find((x) => x.id === selected);
  shownKey = keyOf(t);
  if (!t) { $('editor').replaceChildren(el('p', { className: 'empty', textContent: '왼쪽에서 티켓을 고르면 여기에 열려요.' })); return; }
  const note = el('span', { className: 'note', id: 'note' });
  // 상태는 고르지 않고 버튼으로 넘긴다. 버튼은 지금 칸 저장과 상태 변경을 한 번에 한다
  const act = (label, next, cls = 'act') => el('button', { type: 'submit', className: cls, textContent: label, value: next });
  const buttons = t.status === 'me' ? [act('AI에게 넘기기', 'ai', 'save'), act('저장', '', 'act'), act('완료', 'done')]
    : t.status === 'done' ? [act('다시 열기', 'me', 'save')]
    : [act('저장', '', 'save'), act('완료', 'done')];
  const safe = el('input', { type: 'checkbox', id: 'f-safe', checked: !!t.safe });
  const title = el('textarea', { id: 'f-title', value: t.title || '', rows: 1, maxLength: 200, placeholder: '제목 없음', onkeydown: (e) => { if (e.key === 'Enter') e.preventDefault(); } });
  title.setAttribute('aria-label', '제목');
  // Claude 가 쓰는 칸은 읽기 전용 — 사람은 고치지 않는다
  const areas = FIELDS.map(([k, name, who]) => {
    const head = el('span', {}, name, el('small', { className: who === 'Claude' ? 'chip ai' : 'chip', textContent: who }));
    if (who === 'Claude') return el('div', { className: 'field' }, head, t[k] ? el('div', { className: 'ai-text' }, ...mdBlocks(t[k])) : el('div', { className: 'ai-text none', textContent: '아직 없음' }));
    return el('label', { className: 'field' }, head, el('textarea', { id: `f-${k}`, value: t[k] || '', rows: 1, placeholder: '비어 있음' }));
  });
  // 질문이 있으면 전부 답하거나 덧붙일 말을 적어야 넘길 수 있다
  picked[t.id] = picked[t.id] || draftOf(t.id).picks || {};
  const saveDraft = () => {
    const fields = {};
    for (const k of DRAFT_KEYS) { const a = $(`f-${k}`); if (a && a.value !== (t[k] ?? '')) fields[k] = a.value; }
    putDraft(t.id, { fields, picks: picked[t.id] || {} });
  };
  const qs = questionsOf(t);
  const progress =qs.length ? el('span', { className: 'when' }) : null;
  const note2 = () => $('f-judgment');
  const syncGo = () => {
    if (!qs.length) return;
    const done = qs.filter((q) => pickOf(t, q)).length;
    progress.textContent = `${qs.length}개 중 ${done}개 답함`;
    if (t.status === 'me') buttons[0].disabled = done < qs.length && !(note2() && note2().value.trim());
  };
  const cards = qs.length ? questionCards(t, qs, () => { syncGo(); saveDraft(); }) : null;
  if (qs.length) {
    areas[1].firstChild.firstChild.nodeValue = '덧붙일 말';
    areas[1].lastChild.placeholder = '다르게 하고 싶거나 더 말할 것이 있으면 적어 주세요';
  }
  let armed = false;
  const del = el('button', { type: 'button', className: 'del', textContent: '삭제', onclick: async () => {
    if (!armed) { armed = true; del.textContent = '한 번 더 누르면 삭제돼요'; return; }
    try { await db.collection('tickets').doc(t.id).delete(); dirty = false; selected = null; renderEditor(); }
    catch (e) { note.textContent = '삭제하지 못했어요. 다시 눌러 주세요.'; }
  } });
  const form = el('form', { oninput: (e) => { dirty = true; note.textContent = '저장 전이에요.'; if (e.target.tagName === 'TEXTAREA') grow(e.target); syncGo(); saveDraft(); }, onsubmit: async (e) => {
    e.preventDefault();
    // 바뀐 칸만 쓴다 — 페이지를 열어 둔 사이 AI 가 적은 다른 칸을 덮지 않게
    const values = { title: title.value.trim(), status: (e.submitter && e.submitter.value) || t.status, safe: safe.checked };
    for (const [k, , who] of FIELDS) if (who === '나') values[k] = $(`f-${k}`).value;
    const body = {};
    for (const k of Object.keys(values)) if (values[k] !== (t[k] ?? (k === 'safe' ? false : ''))) body[k] = values[k];
    // 넘길 때 질문과 답을 한 쌍으로 쌓고 두 칸을 비운다 — 옛 판단이 새 판단으로 읽히지 않게
    const answer = qs.length ? composeAnswer(t, values.judgment) : values.judgment;
    if (values.status === 'ai' && t.status !== 'ai' && answer.trim()) {
      const asked = [t.decide || '', questionsText(qs)].filter(Boolean).join('\n\n');
      body.history = [...(Array.isArray(t.history) ? t.history : []), { decide: asked, judgment: answer, at: Date.now() }];
      body.decide = '';
      body.judgment = '';
      body.questions = [];
      delete picked[t.id];
    }
    try {
      const changed = Object.keys(body).length > 0;
      dirty = false; selfWrite = changed;
      putDraft(t.id, { fields: {}, picks: picked[t.id] || {} });   // 다시 그릴 때 옛 글이 되살아나지 않게 먼저 비운다
      if (changed) await db.collection('tickets').doc(t.id).update(body);
      const n = $('note'); if (n) n.textContent = '저장했어요.';
    } catch (err) { dirty = true; selfWrite = false; saveDraft(); note.textContent = err &&err.code === 'invalid_argument' ? '이 계정은 고칠 권한이 없어요.' : '저장하지 못했어요. 다시 눌러 주세요.'; }
  } },
    title,
    el('div', { className: 'props' }, el('span', {}, '상태 ', el('b', { textContent: t.status })), el('label', {}, safe, '구현해도 됨')),
    el('section', { className: 'zone' }, el('h3', {}, '판단 ', progress), qs.length && !t.decide ? null : areas[0], cards, areas[1]),
    pastJudgments(t),
    el('section', { className: 'zone' }, el('h3', { textContent: '배경' }), el('div', { className: 'two' }, areas[2], areas[3])),
    el('details', { className: 'zone log', open: logOpen, ontoggle: (e) => { logOpen = e.target.open; } },
      el('summary', {}, '조사·구현 기록', el('small', { className: 'chip ai', textContent: 'Claude' })), researchBlocks(t, areas[4].lastChild)),
    el('div', { className: 'actions' }, ...buttons, del, note));
  $('editor').replaceChildren(form);
  let restored = false;
  for (const [k, v] of Object.entries(draftOf(t.id).fields || {})) {
    const a = $(`f-${k}`);
    if (a && v !== (t[k] ?? '')) { a.value = v; restored = true; }
  }
  if (restored) { dirty = true; note.textContent = '저장 안 한 글을 되살렸어요.'; }
  growAll();
  syncGo();
}

function select(id) {
  if (id === selected) return;
  if (dirty) { const n = $('note'); if (n) n.textContent = '저장하지 않은 내용이 있어요. 저장한 뒤 옮겨 주세요.'; return; }
  selected = id; renderList(); renderEditor();
  if (matchMedia('(max-width:860px)').matches) $('editor').scrollIntoView();
}

$('add').addEventListener('submit', async (e) => {
  e.preventDefault();
  const title = $('newTitle').value.trim();
  if (!title || !db) return;
  if (dirty) { const n = $('note'); if (n) n.textContent = '저장하지 않은 내용이 있어요. 저장한 뒤 추가해 주세요.'; return; }
  try {
    const ref = db.collection('tickets').doc();
    await ref.set({ title, status: 'ai', safe: false, why: '', done: '', research: '', decide: '', judgment: '', createdAt: Date.now() });
    $('newTitle').value = ''; selected = ref.id; renderList(); renderEditor();
  } catch (err) { $('summary').textContent = '티켓을 추가하지 못했어요. 이 계정의 권한을 확인해 주세요.'; }
});

renderList(); renderEditor();
(async () => {
  db = await claude.use('db');
  if (!db) { $('summary').textContent = '이 화면에서는 티켓을 불러올 수 없어요. claude.ai 에 로그인한 뒤 열어 주세요.'; return; }
  const slow = setTimeout(() => { if (!loaded) $('summary').textContent = '티켓을 아직 불러오지 못했어요. 연결을 확인해 주세요.'; }, 10000);
  db.collection('tickets').onSnapshot((snap) => {
    tickets = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (!snap.metadata.fromCache) { loaded = true; clearTimeout(slow); }
    if (!selected && tickets.length) { const first = tickets.find((t) => t.status === 'me') || tickets[0]; selected = first.id; }
    renderList();
    // 보고 있는 티켓을 멋대로 다시 그리지 않는다. 내가 저장했을 때만 다시 그리고, 다른 쪽이 바꿨으면 띠로 알린다
    const cur = tickets.find((x) => x.id === selected);
    if (!cur || selfWrite || !shownKey) { selfWrite = false; if (!dirty) renderEditor(); }
    else if (keyOf(cur) !== shownKey) showFresh();
  }, () => { clearTimeout(slow); $('summary').textContent = '티켓을 더 이상 불러올 수 없어요. 페이지를 다시 열어 주세요.'; });
})();
</script>
