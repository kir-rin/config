onboarding = false
[theme]
name = "catppuccin"
auto_switch = false

[[keys.command]]
key = "prefix+d"
type = "shell"
command = "bash ~/.claude/skills/side-chat/side-chat.sh toggle"
description = "Side chat toggle"

[[keys.command]]
key = "prefix+f"
type = "shell"
command = "bash ~/.claude/skills/side-chat/side-chat.sh clear"
description = "Side chat clear"

[ui]
agent_panel_sort = "priority"
